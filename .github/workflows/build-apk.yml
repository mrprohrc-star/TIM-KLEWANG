name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Build APK Clean
        run: |
          mkdir -p /tmp/my_source
          cp lib/main.dart /tmp/my_source/

          cd /tmp
          flutter create --org com.hondasales.app --project-name honda_sales_app honda_sales_app
          cd honda_sales_app

          # Pasang plugin pendukung OCR dan Image Picker
          flutter pub add intl image_picker google_mlkit_text_recognition
          cp /tmp/my_source/main.dart lib/main.dart

          # Konfigurasi minSdkVersion dan compileSdkVersion agar kompatibel dengan ML Kit
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle

          chmod +x android/gradlew
          flutter build apk --debug --no-tree-shake-icons

          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/output_apk/Honda-Sales.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Honda-Sales-App
          path: output_apk/Honda-Sales.apk
