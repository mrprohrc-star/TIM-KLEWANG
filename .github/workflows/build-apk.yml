name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Full Android Project & Build
        run: |
          # Backup lib/ if exists
          if [ -d "lib" ]; then
            cp -r lib /tmp/user_lib
          fi
          
          # Create full clean flutter skeleton
          cd ..
          flutter create --org com.hondasales.app --project-name honda_sales_app fresh_project
          
          # Copy skeleton back to current repo
          cp -rn fresh_project/* TIM-KLEWANG/ || true
          cd TIM-KLEWANG
          
          # Restore original lib/ if backup exists
          if [ -d "/tmp/user_lib" ]; then
            cp -r /tmp/user_lib/* lib/ || true
          fi
          
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Honda-Sales-App
          path: build/app/outputs/flutter-apk/app-debug.apk
