name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b 3.24.5 /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Generate Android Files & Build APK
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter create . --org com.hondasales.app --project-name honda_sales_app --platforms=android
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Honda-Sales-App
          path: build/app/outputs/flutter-apk/app-debug.apk
